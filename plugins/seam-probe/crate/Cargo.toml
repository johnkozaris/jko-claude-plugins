[package]
name = "seam-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generic NDJSON probe for embedded-runtime seams (dlopen FFI + framed/raw Unix sockets). Manifest-driven; carries no app-specific knowledge."

[lints.rust]
# Override workspace `unsafe_code = "deny"`. The probe loads arbitrary
# shared libraries via dlopen and dispatches generated extern "C"
# trampolines — both inherently unsafe. All unsafe blocks carry SAFETY
# comments explaining the invariants they assume.
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
panic = "deny"

[[bin]]
name = "seam-probe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
seq-macro = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
