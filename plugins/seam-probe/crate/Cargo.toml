[package]
name = "seam-probe"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Generic NDJSON probe for embedded-runtime seams (dlopen FFI + framed/raw Unix sockets). Manifest-driven; carries no app-specific knowledge."

[lints.rust]
# Override workspace `unsafe_code = "deny"`. The probe loads arbitrary
# shared libraries via dlopen and dispatches generated extern "C"
# trampolines — both inherently unsafe. All unsafe blocks carry SAFETY
# comments explaining the invariants they assume.
unsafe_code = "allow"
dead_code_pub_in_binary = "warn"
linker_messages = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
panic = "deny"
manual_assert_eq = "warn"
manual_clear = "warn"
useless_borrows_in_formatting = "warn"

[[bin]]
name = "seam-probe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
libloading = "0.9"
object = { version = "0.39", default-features = false, features = ["read", "std"] }
seq-macro = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec", "rt"] }

[profile.release]
lto = "thin"
overflow-checks = true
